permissions:
  contents: read

concurrency:
  group: f01-database-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.25.0
          runtime: node@24
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start first empty local Supabase database
        run: |
          mkdir -p "$RUNNER_TEMP/f01b-staged"
          pnpm dlx supabase@2.121.0 init --workdir "$RUNNER_TEMP/f01b-staged"
          pnpm dlx supabase@2.121.0 db start --workdir "$RUNNER_TEMP/f01b-staged"
      - name: Historical replay, live metadata parity and retirement scenarios
        run: node tools/f01-database-replay.mjs staged
      - name: Stop first isolated database
        id: stop-staged
        run: pnpm dlx supabase@2.121.0 stop --no-backup --workdir "$RUNNER_TEMP/f01b-staged"
      - name: Start second empty local Supabase database
        run: |
          mkdir -p "$RUNNER_TEMP/f01b-full"
          pnpm dlx supabase@2.121.0 init --workdir "$RUNNER_TEMP/f01b-full"
          pnpm dlx supabase@2.121.0 db start --workdir "$RUNNER_TEMP/f01b-full"
      - name: Full clean replay and final schema comparison
        run: node tools/f01-database-replay.mjs full
      - name: Clean second isolated database
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/f01b-full/supabase/config.toml"; then
            pnpm dlx supabase@2.121.0 stop --no-backup --workdir "$RUNNER_TEMP/f01b-full"
          fi
      - name: Clean first isolated database if not already stopped
        if: always() && steps.stop-staged.outcome != 'success'
        run: |
          if test -f "$RUNNER_TEMP/f01b-staged/supabase/config.toml"; then
            pnpm dlx supabase@2.121.0 stop --no-backup --workdir "$RUNNER_TEMP/f01b-staged"
          fi
      - name: Start third empty database for exact scoped OAuth rollout
        run: |
          mkdir -p "$RUNNER_TEMP/f01b-identity-rollout"
          pnpm dlx supabase@2.121.0 init --workdir "$RUNNER_TEMP/f01b-identity-rollout"
          pnpm dlx supabase@2.121.0 db start --workdir "$RUNNER_TEMP/f01b-identity-rollout"
      - name: Scoped OAuth renewal and captured43 plus remaining39 readiness rehearsal
        run: node tools/f01-identity-oauth-rollout.mjs
      - name: Clean third isolated database
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/f01b-identity-rollout/supabase/config.toml"; then
            pnpm dlx supabase@2.121.0 stop --no-backup --workdir "$RUNNER_TEMP/f01b-identity-rollout"
          fi
