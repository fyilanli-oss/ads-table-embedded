name: EO-01 Boundary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/eo01a-repository-boundary

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean repository boundary
        run: node --test tests/eo-01a-repository-boundary.test.js
