name: Repository Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          require-lockfile: true
          install: false
      - name: Verify frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run repository governance tests
        run: pnpm test
