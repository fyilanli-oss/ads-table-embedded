name: Shopify Analytics unpublished draft

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DRAFT-ONLY to create one unpublished AdsTable version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopify-app-configuration-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shopify app configuration
    if: ${{ (github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY') || (github.ref == 'refs/heads/codex/eo06-shopify-ecosystem-sales-columns-draft' && github.run_attempt == 1 && inputs.confirmation == 'DRAFT-ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Shopify CLI
        run: npm install --global @shopify/cli@4.8.5

      - name: Validate Shopify app configuration
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app config validate --no-color

      - name: Verify target and stage the reviewed extension
        if: ${{ github.ref == 'refs/heads/codex/eo06-shopify-ecosystem-sales-columns-draft' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tomllib import loads

          config = loads(Path('shopify.app.toml').read_text())
          assert config['name'] == 'AdsTable'
          assert config['client_id'] == '58c91f39f69ca282a94ba06e9648be9e'
          assert config['application_url'] == 'https://embedded.adstable.app/'
          assert not Path('extensions').exists(), 'unexpected existing extensions in checkout'

          fixture = Path('docs/evidence/eo06-shopify-analytics-probe/shopify.extension.toml.example')
          definition, = loads(fixture.read_text())['extensions']
          original, event = definition['events']
          assert definition['type'] == 'analytics_app_events'
          assert definition['handle'] == 'ecosystem-sales-probe'
          assert original['name'] == 'adstable-1.ecosystem_sale_probe'
          assert event['name'] == 'adstable-1.ecosystem_role_probe'
          assert event['currency'] == 'TRY'
          assert event['dimensions']['contribution_role'] == {
              'label': 'Contribution Roles', 'type': 'string', 'optional': False,
          }
          previous_handles = {'purchases', 'sales', 'contribution_from', 'contribution_to'}
          assert {m['handle'] for m in definition['metrics'] if m['source']['event'] == original['name']} == previous_handles
          assert event['dimensions']['contribution_to_sales_amount'] == {
              'label': 'Contribution To amount', 'type': 'int', 'semantic_type': 'money', 'optional': True,
          }
          expected = {
              'ecosystem_purchases': ('Purchase', 'quantity_delta'),
              'ecosystem_sales': ('Sales', 'sales_delta'),
              'ecosystem_contribution_to': ('Contribution To', 'contribution_to_sales_amount'),
          }
          added = [m for m in definition['metrics'] if m['source']['event'] == event['name']]
          assert len(definition['metrics']) == 7 and len(added) == 3
          assert {m['handle']: (m['label'], m['source']['field']) for m in added} == expected
          assert all(m['aggregation'] == 'sum' for m in added)

          target = Path('extensions/ecosystem-sales-probe/shopify.extension.toml')
          target.parent.mkdir(parents=True)
          target.write_bytes(fixture.read_bytes())
          print('Verified the separate Contribution To amount and preserved the existing metrics.')
          PY

      - name: Create the authorized Shopify app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            shopify app deploy --allow-updates --no-color --source-control-url "$COMMIT_URL"
            exit 0
          fi

          test "$GITHUB_REF" = 'refs/heads/codex/eo06-shopify-ecosystem-sales-columns-draft'
          test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"
          version=eo06e-analytics-ecosystem-sales-columns-draft
          shopify app versions list --json > "$RUNNER_TEMP/shopify-versions-before.json"
          if grep -Fq "$version" "$RUNNER_TEMP/shopify-versions-before.json"; then
            echo 'The named draft already exists. Stopping without creating another version.'
            exit 1
          fi
          cat "$RUNNER_TEMP/shopify-versions-before.json"
          shopify app deploy --no-release --no-color --version "$version" --source-control-url "$COMMIT_URL"
          shopify app versions list --json > "$RUNNER_TEMP/shopify-versions-after.json"
          cat "$RUNNER_TEMP/shopify-versions-after.json"
          grep -Fq "$version" "$RUNNER_TEMP/shopify-versions-after.json"
