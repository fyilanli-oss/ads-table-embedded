name: Shopify app configuration deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to create and release a Shopify app version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopify-app-configuration-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shopify app configuration
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Shopify CLI
        run: npm install --global @shopify/cli@4.8.5

      - name: Validate Shopify app configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app config validate --no-color

      - name: Create and release Shopify app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --allow-updates --no-color --source-control-url "$COMMIT_URL"
